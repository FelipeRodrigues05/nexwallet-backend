x-app-environment: &app-environment
  DB_URL: jdbc:mysql://database:3306/nexwallet?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_USERNAME: docker
  DB_PASSWORD: password
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  JWT_SECRET: nexwallet-super-secret-key-change-in-production
  DEFAULT_CLIENT_SECRET: nexwallet-secret
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  DDL_AUTO: validate
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  APP_ENVIRONMENT: docker

x-app-volumes: &app-volumes
  - ./src:/app/src
  - ./pom.xml:/app/pom.xml
  - maven_cache:/root/.m2

services:
  api:
    build:
      context: .
      target: dev
    image: nexwallet-backend:dev
    container_name: nexwallet-api
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "35729:35729"
    volumes: *app-volumes
    environment:
      <<: *app-environment
      NEXWALLET_RUNTIME_ROLE: api
      SERVER_PORT: 8000
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  transaction-worker:
    build:
      context: .
      target: dev
    image: nexwallet-backend:dev
    container_name: nexwallet-transaction-worker
    restart: unless-stopped
    volumes: *app-volumes
    environment:
      <<: *app-environment
      NEXWALLET_RUNTIME_ROLE: transaction-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  transfer-worker:
    build:
      context: .
      target: dev
    image: nexwallet-backend:dev
    container_name: nexwallet-transfer-worker
    restart: unless-stopped
    volumes: *app-volumes
    environment:
      <<: *app-environment
      NEXWALLET_RUNTIME_ROLE: transfer-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexwallet
      MYSQL_USER: docker
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "docker",
          "-ppassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:v1.15
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  grafana_data:
  maven_cache:
