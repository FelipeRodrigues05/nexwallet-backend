global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexwallet
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - nexwallet-api:8000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: nexwallet-backend
