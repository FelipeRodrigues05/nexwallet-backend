spring.application.name=nexwallet-${nexwallet.runtime.role:api}
server.port=${SERVER_PORT:8000}

# Runtime process boundary. Supported roles are api, transaction-worker and
# transfer-worker. The default preserves local `spring-boot:run` behaviour.
nexwallet.runtime.role=${NEXWALLET_RUNTIME_ROLE:api}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexwallet?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:docker}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
info.app.name=nexwallet
info.app.version=1.0.0
info.app.description=Banking system with RabbitMQ integration

# Prometheus metrics tags
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:local}

# JPA Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
app.jwt.secret=${JWT_SECRET:nexwallet-super-secret-key-change-in-production}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Default seeded client
app.client.default.id=${DEFAULT_CLIENT_ID:nexwallet-app}
app.client.default.name=${DEFAULT_CLIENT_NAME:NexWallet App}
app.client.default.secret=${DEFAULT_CLIENT_SECRET:}

# Mailing
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Investment scheduler cron (default: every day at midnight)
app.investment.scheduler.cron=${INVESTMENT_CRON:0 0 0 * * *}

# Credit card default limit
app.card.credit.default-limit=${CARD_CREDIT_DEFAULT_LIMIT:1000}

# Card bill close cron (default: 1st of every month at midnight)
app.card.bill.close.cron=${CARD_BILL_CLOSE_CRON:0 0 0 1 * *}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method

# Spring DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Encryption
app.security.encryption-key=${ENCRYPTION_KEY:Nexwallet2025DevKeyABC!!!!!!!!}

# Scheduled payments cron (default: every day at 8am)
app.scheduling.cron=${SCHEDULING_CRON:0 0 8 * * *}
